name: RASM Python Engine CI

on:
  push:
    branches:
      - feat/python-engine-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rasm-python-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python_engine/pyproject.toml

      - name: Install Python engine and test dependencies
        working-directory: python_engine
        run: python -m pip install -e ".[dev,vision]"

      - name: Run Python engine tests
        working-directory: python_engine
        run: python -m pytest
